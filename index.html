<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(rationalize) - Continued Fractions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>(rationalize)</h1>

  <div class="input-section">
    <input
      type="number"
      id="numberInput"
      placeholder="Enter a decimal number (e.g., 3.14159)"
      step="any"
      autofocus
    >
  </div>

  <div id="results" class="results">
    <div class="section">
      <div id="convergents"></div>
    </div>

    <div class="section">
      <div class="cf-label">Continued fraction representation:</div>
      <div id="cfSequence" class="cf-sequence"></div>
    </div>
  </div>

  <div class="help-icon" id="helpIcon">?</div>
  <div class="help-popup" id="helpPopup">
    <p><strong>(rationalize)</strong> finds rational approximations using the continued fraction algorithm.</p>
    <p style="margin-top: 0.75rem;">Convergents are ranked by quality: balancing accuracy with simplicity. The continued fraction shows the mathematical representation.</p>
    <p style="margin-top: 0.75rem;"><a href="https://en.wikipedia.org/wiki/Continued_fraction" target="_blank">Learn more on Wikipedia →</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
